<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Unicorns &amp; Rainbows</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{position:absolute;left:50%;transform:translateX(-50%);pointer-events:auto}
#ui>.top{top:4vmin}
#ui>.bottom{bottom:4vmin}
#ui>.center{top:50%;transform:translate(-50%,-50%)}
.panel{padding:2vmin 3vmin;font-size:3vmin;color:#fff;text-align:center;text-shadow:0 0.3vmin 1vmin #000}
.button{padding:1.5vmin 4vmin;font-size:2.5vmin;color:#fff;background:#ffffff33;border:0.2vmin solid #fff8;border-radius:1vmin;cursor:pointer;user-select:none}
.button:hover{background:#ffffff55}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script src="js/gl.js"></script>
<script src="js/input.js"></script>
<script src="js/camera.js"></script>
<script src="js/entities.js"></script>
<script src="js/ui.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
