<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Unicorns &amp; Rainbows</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{position:absolute;left:50%;transform:translateX(-50%);pointer-events:auto}
#ui>.top{top:4vmin}
#ui>.bottom{bottom:4vmin}
#ui>.center{top:50%;transform:translate(-50%,-50%)}
#ui>.bottomleft{left:4vmin;bottom:4vmin;transform:none}
#ui>.bottomright{left:auto;right:4vmin;bottom:4vmin;transform:none}
#ui>.barsleft{left:2.5vmin;top:38vmin;transform:none}
#ui>.barsright{left:auto;right:2.5vmin;top:38vmin;transform:none}
#ui>.leftcol{left:2vmin;top:0;transform:none}
#ui>.leftcol2{left:19vmin;top:0;transform:none}
.slotbtn{padding:0.5vmin 1vmin;font-size:1.7vmin;max-width:15vmin;white-space:nowrap;overflow:hidden}
.panel{padding:2vmin 3vmin;font-size:3vmin;color:#fff;text-align:center;text-shadow:0 0.3vmin 1vmin #000}
.button{padding:1.5vmin 4vmin;font-size:2.5vmin;color:#fff;background:#ffffff33;border:0.2vmin solid #fff8;border-radius:1vmin;cursor:pointer;user-select:none;touch-action:none}
.button:hover{background:#ffffff55}
.bar{width:3.2vmin;height:26vmin;background:#ffffff22;border:0.2vmin solid #fff6;border-radius:1vmin;overflow:hidden;position:relative}
.bar>i{position:absolute;bottom:0;left:0;width:100%;display:block}
#hud{position:fixed;top:2vmin;right:2vmin;color:#fff;font-size:2vmin;text-shadow:0 0.3vmin 1vmin #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="hud"></div>
<script src="js/gl.js"></script>
<script src="js/geometry.js"></script>
<script src="js/texture.js"></script>
<script src="js/input.js"></script>
<script src="js/camera.js"></script>
<script src="js/objects.js"></script>
<script src="js/ui.js"></script>
<script src="js/resources.js"></script>
<script src="js/modules.js"></script>
<script src="js/galaxy.js"></script>
<script src="js/system.js"></script>
<script src="js/menu_state.js"></script>
<script src="js/ship_state.js"></script>
<script src="js/galaxy_state.js"></script>
<script src="js/system_state.js"></script>
<script src="js/system_travel_state.js"></script>
<script src="js/hyperjump_state.js"></script>
<script src="js/main.js"></script>
</body>
</html>
