<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Unicorns &amp; Rainbows</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#u{position:fixed;inset:0;pointer-events:none}
#u>*{position:absolute;left:50%;transform:translateX(-50%);pointer-events:auto}
#u>.top{top:4vmin}
#u>.bottom{bottom:4vmin}
#u>.center{top:50%;transform:translate(-50%,-50%)}
#u>.bl{left:4vmin;bottom:4vmin;transform:none}
#u>.br{left:auto;right:4vmin;bottom:4vmin;transform:none}
#u>.lc{left:2vmin;top:0;transform:none}
#u>.l2{left:19vmin;top:0;transform:none}
#u>.rc{left:auto;right:2vmin;top:0;transform:none}
#u>.dbg{left:2vmin;top:2vmin;transform:none}
.panel{padding:2vmin 3vmin;font-size:3vmin;color:#fff;text-align:center;text-shadow:0 0.3vmin 1vmin #000}
.button{padding:1.5vmin 4vmin;font-size:2.5vmin;color:#fff;background:#0009;border:0.2vmin solid #fff8;border-radius:1vmin;cursor:pointer;user-select:none;touch-action:none;text-shadow:0 0.2vmin 0.6vmin #000}
.button:hover{background:#000c}
/* fixed-size editor rows - after .button/.panel so they win the cascade */
.sb{box-sizing:border-box;width:16vmin;height:3vmin;line-height:2vmin;padding:0.4vmin 1vmin;font-size:1.4vmin;white-space:nowrap;overflow:hidden;text-align:left;border-radius:0.6vmin}
/* no-text health strip (ship / support corvette / enemy). fill via inline linear-gradient. */
.sf{box-sizing:border-box;width:16vmin;height:1.4vmin;padding:0;border:0.15vmin solid #fff4;border-radius:0.5vmin;text-shadow:none}
#h{position:fixed;top:2vmin;right:2vmin;color:#fff;font-size:2vmin;text-shadow:0 0.3vmin 1vmin #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="u"></div>
<div id="h"></div>
<script src="js/include.js"></script>
<script src="js/gl.js"></script>
<script src="js/sound.js"></script>
<script src="js/geometry.js"></script>
<script src="js/texture.js"></script>
<script src="js/input.js"></script>
<script src="js/camera.js"></script>
<script src="js/objects.js"></script>
<script src="js/ui.js"></script>
<script src="js/resources.js"></script>
<script src="js/modules.js"></script>
<script src="js/debug.js"></script>
<script src="js/galaxy.js"></script>
<script src="js/system.js"></script>
<script src="js/menu_state.js"></script>
<script src="js/ship_state.js"></script>
<script src="js/galaxy_state.js"></script>
<script src="js/system_state.js"></script>
<script src="js/system_travel_state.js"></script>
<script src="js/hyperjump_state.js"></script>
<script src="js/main.js"></script>
</body>
</html>
